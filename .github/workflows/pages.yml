name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Test
        working-directory: app
        run: npx vitest run
      - name: E2E smoke tests
        working-directory: app
        # Builds its own dist-e2e/ against fixture data; the deploy build below is separate.
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Build
        working-directory: app
        run: npm run build
      - name: Copy data into site
        run: cp -r data app/dist/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
