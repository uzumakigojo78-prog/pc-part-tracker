name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Tag name on tag pushes, commit SHA otherwise (workflow_dispatch from a branch).
      APK_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build web app and sync Android
        working-directory: app
        run: npm run build:android
      - name: Kotlin unit tests
        working-directory: app/android
        run: ./gradlew test
      - name: Decode keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - building a DEBUG APK. See README to add release signing secrets."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName="${APK_VERSION#v}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pc-part-tracker-$APK_VERSION.apk"
      - name: Assemble debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: app/android
        run: |
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName="${APK_VERSION#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/pc-part-tracker-$APK_VERSION-debug.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-part-tracker-apk
          path: ${{ runner.temp }}/pc-part-tracker-*.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/pc-part-tracker-*.apk
